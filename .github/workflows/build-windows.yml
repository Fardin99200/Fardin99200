name: Build RareCash.exe (Windows)

on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main", "master"]
    paths-ignore: ["**.md"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Bundle Chromium for the Vyro bot
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: python -m playwright install chromium

      - name: Download FFmpeg (video editing)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          } catch {
            Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_src
          New-Item -ItemType Directory -Force bundle/ffmpeg | Out-Null
          Get-ChildItem ffmpeg_src -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination bundle/ffmpeg
          Get-ChildItem bundle/ffmpeg

      - name: Download VPN engine (wireproxy)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest https://github.com/windtf/wireproxy/releases/download/wireproxy/wireproxy_windows_amd64.tar.gz -OutFile wp.tar.gz
          New-Item -ItemType Directory -Force bundle/vpn_bin | Out-Null
          tar -xzf wp.tar.gz -C bundle/vpn_bin
          Get-ChildItem bundle/vpn_bin

      - name: Build RareCash.exe
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: >
          pyinstaller rarecash.py --name RareCash --onedir --console --noconfirm
          --add-data "web;web" --add-data "bot.example.yaml;." --add-data ".env.example;."
          --add-data "bundle/ffmpeg;ffmpeg" --add-data "bundle/vpn_bin;vpn_bin"
          --hidden-import bot --collect-submodules clipper
          --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime
          --collect-all playwright --collect-data cv2 --collect-data googleapiclient
          --collect-submodules uvicorn --collect-submodules yt_dlp

      - name: Self-test the exe
        run: dist\RareCash\RareCash.exe --selftest

      - name: Add start guide
        shell: pwsh
        run: |
          @"
          RARE CASH
          =========
          1. Is folder ko kahin bhi rakho (jaise C:\RareCash). Folder ke andar hi rehne do.
          2. RareCash.exe double-click karo. Browser mein dashboard khulega: http://localhost:8000
          3. Kaali window band karoge to Rare Cash band ho jayega.
          Windows "protected your PC" bole to: More info -> Run anyway.
          Tumhara data (bot.db, bot.yaml, .env, output, vpn) isi folder mein banega.
          "@ | Out-File -Encoding utf8 dist/RareCash/START-HERE.txt

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/RareCash -DestinationPath RareCash-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RareCash-windows
          path: RareCash-windows.zip
          retention-days: 30
