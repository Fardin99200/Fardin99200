<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rare Cash</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23111'/><path d='M16 7l8 6-8 12-8-12z' fill='%23fff'/></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="#dashboard" title="Rare Cash">
      <svg viewBox="0 0 24 24"><path d="M12 3l8 6-8 12-8-12z" fill="currentColor"/><path d="M4 9h16M9 9l3 12 3-12M9 9l3-6 3 6" stroke="#111" stroke-width="1.2" fill="none" stroke-linejoin="round"/></svg>
    </a>
    <nav id="nav">
      <a href="#dashboard" data-tab="dashboard" data-label="Dashboard"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Dashboard</span></a>
      <a href="#pages" data-tab="pages" data-label="Pages"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span>Pages</span></a>
      <a href="#add" data-tab="add" data-label="Add Video"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg><span>Add</span></a>
      <a href="#campaigns" data-tab="campaigns" data-label="Campaigns"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span>Campaigns</span></a>
      <a href="#clips" data-tab="clips" data-label="Clips"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M10 9l5 3-5 3z"/></svg><span>Clips</span></a>
      <a href="#schedule" data-tab="schedule" data-label="Schedule"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>Schedule</span></a>
      <a href="#earnings" data-tab="earnings" data-label="Earnings"><svg viewBox="0 0 24 24"><path d="M12 4v16M16 8.5c0-1.4-1.8-2.5-4-2.5s-4 1.1-4 2.5S9.8 11 12 11.5s4 1.1 4 2.5-1.8 2.5-4 2.5-4-1.1-4-2.5"/></svg><span>Earnings</span></a>
      <a href="#logs" data-tab="logs" data-label="Logs"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 10l2 2-2 2M12 14h4"/></svg><span>Logs</span></a>
    </nav>
    <nav class="nav-bottom">
      <a href="#settings" data-tab="settings" data-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg><span>Settings</span></a>
    </nav>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h1 class="greet" id="greet">Rare Cash</h1>
        <div class="status-line"><span id="engineDot" class="dot"></span><span id="statusText">Loading...</span></div>
      </div>
      <div class="top-actions">
        <span id="vpnChip"></span>
        <button id="vpnBtn" class="vpn-btn off" title="Built-in VPN ON / OFF">
          <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <span id="vpnLabel">VPN OFF</span>
        </button>
        <label class="power" title="Bot ON / OFF">
          <input type="checkbox" id="powerToggle">
          <span class="power-track"><span class="power-knob"></span></span>
          <b id="powerLabel">...</b>
        </label>
        <div class="avatar" title="Rare Cash">RC</div>
      </div>
    </header>

    <section id="tab-dashboard" class="tab"></section>
    <section id="tab-pages" class="tab"></section>
    <section id="tab-add" class="tab"></section>
    <section id="tab-campaigns" class="tab"></section>
    <section id="tab-clips" class="tab"></section>
    <section id="tab-schedule" class="tab"></section>
    <section id="tab-earnings" class="tab"></section>
    <section id="tab-logs" class="tab"></section>
    <section id="tab-settings" class="tab"></section>
  </main>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <button class="modal-close" aria-label="Close" onclick="closeModal()">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="tooltip" class="tooltip" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
